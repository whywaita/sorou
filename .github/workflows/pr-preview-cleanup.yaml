name: PR Preview Cleanup

on:
  pull_request:
    types: [closed]

# No permissions needed (notifying via Discord, not PR comments)

jobs:
  notify-cleanup:
    runs-on: ubuntu-latest
    # Skip forked PRs (no deployments created)
    if: github.event.pull_request.head.repo.fork == false

    steps:
      # Notify cleanup to Discord (temporary account expires automatically)
      - name: Notify cleanup to Discord
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"

          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$(cat <<EOF
          {
            "embeds": [{
              "title": "🧹 Preview environment cleaned up",
              "description": "📋 **#${PR_NUMBER}** ${PR_TITLE}\n\nTemporary account has expired or will expire automatically.",
              "color": 10070709,
              "footer": { "text": "sorou PR Preview Cleanup" }
            }]
          }
          EOF
          )"
          echo "Sent notification to Discord"
