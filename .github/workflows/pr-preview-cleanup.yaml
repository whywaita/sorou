name: PR Preview Cleanup

on:
  pull_request:
    types: [closed]

# No permissions needed (notifying via Discord, not PR comments)

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
  DB_NAME: sorou-pr-${{ github.event.pull_request.number }}-db

jobs:
  cleanup-preview:
    runs-on: ubuntu-latest
    # Skip forked PRs (no deployments created)
    if: github.event.pull_request.head.repo.fork == false

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - run: npm ci

      # Worker Previews cannot be deleted with the cf CLI (beta) or the API
      # today, so only the per-PR database is removed here. The Preview itself
      # stays attached to the `sorou` Worker; delete it from the dashboard
      # (Workers > sorou > Previews) when cleaning up.
      - name: Delete D1 database
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "🗑 Deleting D1 database: ${DB_NAME}"
          db_id=$(npx --no-install cf d1 list | jq -r --arg name "$DB_NAME" \
            'if type == "object" and has("result") then .result else . end
             | (if type == "array" then . else [] end)
             | .[] | select(.name == $name) | (.uuid // .id // empty)' | head -1 || true)
          if [ -z "$db_id" ]; then
            echo "⚠ D1 database '${DB_NAME}' not found — continuing"
            exit 0
          fi
          npx --no-install cf d1 delete "$db_id" --force || {
            echo "⚠ D1 deletion failed — continuing"
          }

      # Notify cleanup completion to Discord
      - name: Notify cleanup to Discord
        if: always()
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$(cat <<EOF
          {
            "embeds": [{
              "title": "🧹 Preview environment cleaned up",
              "description": "📋 **#${PR_NUMBER}** ${PR_TITLE}\n\n- Preview: \`${PREVIEW_NAME}\` (kept, delete from the dashboard)\n- D1: \`${DB_NAME}\`",
              "color": 10070709,
              "footer": { "text": "sorou PR Preview Cleanup" }
            }]
          }
          EOF
          )"
          echo "✅ Sent notification to Discord"
