name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# No permissions needed (notifying via Discord, not PR comments)

# Serialize pushes to the same PR (cancel stale runs)
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    # Skip forked PRs (no access to DISCORD_WEBHOOK_URL secret)
    if: github.event.pull_request.head.repo.fork == false

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - run: npm ci

      # Add wrangler to PATH (installed as devDependency)
      - name: Add node_modules/.bin to PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # Type check
      - name: Type check
        run: npx tsc --noEmit

      # Run tests
      - name: Run tests
        run: npm test

      # Create D1 database in temporary account
      - name: Create D1 database
        id: d1
        run: |
          CREATE_OUT=$(wrangler d1 create sorou-db --temporary 2>&1) || true
          echo "$CREATE_OUT"
          DB_ID=$(echo "$CREATE_OUT" | grep -oP '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          if [ -z "$DB_ID" ]; then
            echo "Failed to extract database ID"
            exit 1
          fi
          echo "db_id=${DB_ID}" >> "$GITHUB_OUTPUT"

      # Apply D1 migrations
      - name: Apply D1 migrations
        run: |
          set -e
          for f in ./drizzle/migrations/*.sql; do
            echo "Running migration: $f"
            wrangler d1 execute sorou-db --remote --file="$f" --temporary
          done

      # Generate wrangler config from template
      - name: Generate wrangler config
        run: |
          sed -e "s/__WORKER_NAME__/sorou-preview/g" \
              -e "s/__D1_NAME__/sorou-db/g" \
              -e "s/__D1_ID__/${{ steps.d1.outputs.db_id }}/g" \
              wrangler.pr.toml > wrangler.preview.toml
          cat wrangler.preview.toml

      # Deploy Worker to temporary account
      - name: Deploy to Cloudflare Workers
        id: deploy
        run: |
          DEPLOY_OUTPUT=$(wrangler deploy --config wrangler.preview.toml --temporary 2>&1)
          echo "$DEPLOY_OUTPUT"

          PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'https://[a-zA-Z0-9._-]+\.workers\.dev' | head -1)
          if [ -z "$PREVIEW_URL" ]; then
            echo "Could not extract workers.dev URL from deploy output"
            PREVIEW_URL="(URL could not be determined — check Actions log)"
          fi
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"

      # Get PR title for Discord notification
      - name: Get PR title
        id: pr_info
        run: |
          PR_TITLE=$(gh pr view ${{ github.event.pull_request.number }} --json title --jq '.title')
          echo "pr_title=${PR_TITLE}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      # Send preview URL to Discord
      - name: Notify preview URL to Discord
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          PR_TITLE: ${{ steps.pr_info.outputs.pr_title }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"

          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$(cat <<EOF
          {
            "embeds": [{
              "title": "🚀 Preview environment deployed",
              "description": "🔗 ${PREVIEW_URL}\n\n📋 **#${PR_NUMBER}** ${PR_TITLE}\n🌿 \`${BRANCH}\`\n⏳ Temporary account (expires in 60 min)",
              "color": 5763719,
              "footer": { "text": "sorou PR Preview" }
            }]
          }
          EOF
          )"
          echo "Sent notification to Discord"
